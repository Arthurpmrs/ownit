[project]
name = "api"
version = "0.1.0"
description = "Ownit - Self-Regulated Learning Application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.135.3",
    "haystack-ai>=2.15.0",
    "pgvector>=0.3.6",
    "pgvector-haystack>=0.1.0",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.48",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "respx>=0.23.1",
    "ruff>=0.15.9",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings"

[tool.ruff]
line-length = 90
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT", "N"]
unfixable = ["F401"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pyright]
extraPaths = ["."]
